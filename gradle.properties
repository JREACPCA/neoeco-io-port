### Gradle 运行参数 ###
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 关闭文件系统监视：在某些受限/沙箱环境下原生监视器会因权限被拒而打印异常，
# 构建本身不受影响，但关掉可保持日志干净。
org.gradle.vfs.watch=false

### 环境版本 ###
# NeoForge 21.1.169：AE2 1.21.1 分支自己 pin 的版本。
#
# 为什么不用最新的 21.1.252：
#   本工程使用的 NeoForm 数据是 neoform-1.21.1-20240808.144430（2024 年 8 月），
#   而 21.1.252 明显更年轻。补丁能应用成功，但应用后的 Minecraft 源码在
#   recompile 阶段无法编译，报：
#       ERROR Line: 1, ..net.minecraft.world.ticks.package-info...: null
#       Node action for recompile failed
#   该失败与本模组代码无关（最小 @Mod 工程同样失败），也与 JDK 版本、
#   NeoForm 缓存、中文路径、磁盘空间、内存、代理均无关（均已实测排除）。
#   详见 BUILD.md 第 5 节。
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.169
neo_version_range=[21.1.0,)
# NeoForge 1.21.1 的 FML 加载器版本为 4.x
loader_version_range=[4,)

# Parchment 官方映射（提供带参数名的反混淆，编译时更友好）
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

### 模组元数据 ###
mod_id=neoeco_io
mod_name=Neo ECO IO Port
mod_license=GPL-3.0
mod_version=1.0.0
mod_group_id=cn.neoeco.io
mod_authors=NeoEcoIO
mod_description=ME IO 端口的高速替代品：更快、可超频，并通过 AE2 标准存储 API 兼容 Neo ECO AE Extension 等扩展模组。

### 依赖版本 ###
# AE2 1.21.1（19.2.x）发布在 Maven Central：org.appliedenergistics:appliedenergistics2
# 19.2.18 为 1.21.1 分支上的最新稳定版；Neo ECO AE Extension 要求 >= 19.2.17
ae2_version=19.2.18
# AE2 1.21.1 使用 Java 21 编译
java_version=21
