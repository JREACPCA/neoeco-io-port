pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // ModDevGradle 与 NeoForge userdev 都只发布在这个仓库
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // 让 Gradle 能自动下载 JDK 21 工具链（本机没有 JDK 21 时会用到）
    // 若离线构建，请把 auto-download 设为 false 并显式配置 org.gradle.java.installations.paths
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'neoeco-io-port'
